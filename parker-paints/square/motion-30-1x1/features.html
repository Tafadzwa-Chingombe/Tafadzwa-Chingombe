<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="lib/parker.css">
<style>
  .bg { position: absolute; inset: 0; background: var(--cream); }
  .grid { position: absolute; left: 60px; right: 60px; top: 300px; display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
  .tile { border-radius: 36px; padding: 44px 36px; height: 400px; display: flex; flex-direction: column; justify-content: space-between; color: #fff; box-shadow: 0 20px 40px rgba(25,56,98,0.18); }
  .tile svg { width: 110px; height: 110px; }
  .tile b { font: 900 52px/1.02 Montserrat, sans-serif; text-transform: uppercase; }
  .t1 { background: linear-gradient(150deg, #ffb35c, #fe9832 50%, #e07a12); }
  .t2 { background: linear-gradient(150deg, #3d74f0, #1c55e0 50%, #1440b0); }
  .t3 { background: linear-gradient(150deg, #2a4f86, #193862); }
  .t4 { background: linear-gradient(150deg, #e9cf6a, #c9a227 55%, #9c7c14); color: #2b1e02; }
  @media (min-aspect-ratio: 3/4) { .grid { top: 70px; left: 150px; right: 150px; gap: 20px; } .tile { height: 300px; padding: 30px; border-radius: 28px; } .tile svg { width: 76px; height: 76px; } .tile b { font-size: 38px; } }
</style>
</head>
<body>
<div class="stage">
  <div class="bg"></div>
  <div class="cam" data-from="1.0" data-to="1.04" data-whip="up">
    <div class="grid">
      <div class="tile t1" data-pop="0.2"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4.5"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3M4.6 4.6l2.1 2.1M17.3 17.3l2.1 2.1M4.6 19.4l2.1-2.1M17.3 6.7l2.1-2.1"/></svg><b>UV<br>resistant</b></div>
      <div class="tile t2" data-pop="1.95"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2.5S5.5 10 5.5 14.5a6.5 6.5 0 0 0 13 0C18.5 10 12 2.5 12 2.5z"/><path d="M9 15a3 3 0 0 0 3 3"/></svg><b>Weather-<br>proof</b></div>
      <div class="tile t3" data-pop="3.1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3a9 9 0 1 0 0 18c1.5 0 2-1 2-2s-1-1.5-1-2.5S14 15 15 15h2a4 4 0 0 0 4-4c0-4.4-4-8-9-8z"/><circle cx="7.5" cy="11" r="1.3"/><circle cx="10.5" cy="7" r="1.3"/><circle cx="15" cy="7.5" r="1.3"/></svg><b>Long-lasting<br>colour</b></div>
      <div class="tile t4" data-pop="4.7"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="15" height="6" rx="2"/><path d="M18 6h2v5h-8v3"/><rect x="10.5" y="14" width="3" height="7.5" rx="1"/></svg><b>Smooth,<br>easy finish</b></div>
    </div>
  </div>
</div>
<script type="module">
import { shot } from './lib/kit.js';
shot(7.2);
</script>
</body>
</html>
