<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="lib/parker.css">
<style>
  .bg { position: absolute; inset: 0; background: radial-gradient(ellipse 90% 60% at 50% 40%, #1f4fae 0%, #193862 45%, #0b1730 100%); }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; }
  .block { position: absolute; left: 60px; right: 60px; top: 330px; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .block .logo { font-size: 150px; }
  .block .tagline { font-size: 40px; margin-top: 30px; }
  .story { margin-top: 64px; font: 400 72px/1.08 'DM Serif Display', serif; }
  .story i { color: var(--orange); }
  .contact { margin-top: 64px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .contact .lbl { font: 700 26px/1 Inter, sans-serif; letter-spacing: 0.28em; text-transform: uppercase; color: var(--orange); }
  .contact .num { font: 800 50px/1.15 Montserrat, sans-serif; }
  .contact .num i { font-style: normal; color: rgba(255,255,255,0.45); padding: 0 16px; }
  .contact .addr { font: 500 30px/1.3 Inter, sans-serif; color: rgba(255,255,255,0.8); }
  .pills { margin-top: 34px; display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
  .pill { padding: 16px 26px; border-radius: 999px; background: var(--orange); color: #1b1203; font: 700 30px/1 Inter, sans-serif; }
  .pill.ghost { background: transparent; border: 2px solid rgba(255,255,255,0.5); color: #fff; }
  @media (min-aspect-ratio: 3/4) {
    .block { top: 70px; } .block .logo { font-size: 104px; } .block .tagline { font-size: 30px; margin-top: 20px; }
    .story { font-size: 54px; margin-top: 34px; } .contact { margin-top: 34px; gap: 10px; } .contact .num { font-size: 40px; } .contact .addr { font-size: 24px; }
    .pills { margin-top: 22px; } .pill { font-size: 24px; padding: 12px 20px; }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="bg"></div>
  <canvas id="cv"></canvas>
  <div class="cam" data-from="1.0" data-to="1.03" data-whip="none">
    <div class="block">
      <span class="logo" data-pop="0.15">PARKER<sup>™</sup></span>
      <div class="tagline" data-rise="0.6">Parker the <i>perfect</i> finish</div>
      <div class="story" data-rise="1.3">Every wall tells a story.<br><i>Let's make yours unforgettable.</i></div>
      <div class="contact" data-rise="2.4">
        <div class="lbl">Call us</div>
        <div class="num">+263 77 472 6179<i>·</i>(0242) 663270</div>
        <div class="addr">6 Portland Road, Workington, Harare</div>
      </div>
      <div class="pills" data-rise="3.0"><span class="pill">Free colour samples</span><span class="pill ghost">Find a dealer</span></div>
    </div>
  </div>
</div>
<script type="module">
import { shot, W, H, prog, ease } from './lib/kit.js';
const cv = document.getElementById('cv'); let ctx;
shot(7.6, (t) => {
  // a slow wave of blue light moving through the background, like wet paint catching the light
  const w = cv.width, h = cv.height;
  for (let k = 0; k < 3; k++) {
    const x = w * (0.2 + 0.3 * k) + Math.sin(t * 0.6 + k * 2) * w * 0.15, y = h * (0.3 + 0.2 * k) + Math.cos(t * 0.5 + k) * h * 0.08;
    const g = ctx.createRadialGradient(x, y, 0, x, y, w * 0.6);
    g.addColorStop(0, k === 1 ? 'rgba(254,152,50,0.16)' : 'rgba(60,120,255,0.22)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  }
}, () => { cv.width = W(); cv.height = H(); ctx = cv.getContext('2d'); });
</script>
</body>
</html>
