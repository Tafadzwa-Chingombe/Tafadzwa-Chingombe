<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="lib/parker.css">
<style>
  #cv { filter: contrast(1.06) saturate(1.05); }
  .warm { position: absolute; inset: 0; background: linear-gradient(160deg, rgba(255, 210, 150, 0.25), transparent 50%, rgba(20, 10, 0, 0.3)); mix-blend-mode: soft-light; }
  .words .big { font-size: 96px; }
  @media (min-aspect-ratio: 3/4) { .words .big { font-size: 76px; } }
  .line2 { margin-top: 10px; }
</style>
</head>
<body>
<div class="stage">
  <div class="cam" data-from="1.0" data-to="1.06" data-whip="left"><canvas class="full" id="cv"></canvas></div>
  <div class="warm"></div>
  <div class="words">
    <div class="big serif" data-rise="3.5">No brush marks.</div>
    <div class="big serif line2" data-rise="4.6"><span class="hl">No roller tracks.</span></div>
  </div>
</div>
<script type="module">
import { shot, W, H, prog, ease, clamp, lerp } from './lib/kit.js';
import { plaster, freshPaint, roller, sunlight } from './lib/fx.js';
const cv = document.getElementById('cv'); let ctx, oldW, newW;
const COLOR = '#8fa37a';                      // sage green, like the living room later in the film
const passes = [[0.3, 1.1], [1.55, 1.1], [2.8, 1.1], [4.05, 1.0]];   // [start, duration] of each stroke, bottom to top
shot(6.2, (t) => {
  const w = cv.width, h = cv.height, n = passes.length, sw = w / (n - 0.6);
  ctx.drawImage(oldW, 0, 0);
  let cur = null;
  passes.forEach(([s, d], k) => {
    const p = ease.inOut(prog(t, s, d)); if (p <= 0) return;
    const x0 = k * sw - sw * 0.25, top = lerp(h * 1.05, -h * 0.05, p);
    ctx.save(); ctx.beginPath();
    // a slightly ragged leading edge, thick paint ridge at the sides
    ctx.moveTo(x0, h + 20); ctx.lineTo(x0, top + 30);
    for (let i = 0; i <= 12; i++) ctx.lineTo(x0 + (sw * i) / 12, top + Math.sin(i * 1.7 + k) * 6 + (i % 2 ? 4 : 0));
    ctx.lineTo(x0 + sw, h + 20); ctx.closePath(); ctx.clip();
    ctx.drawImage(newW, 0, 0);
    // wet sheen near the roller, drying behind it
    const g = ctx.createLinearGradient(0, top, 0, top + h * 0.35);
    g.addColorStop(0, 'rgba(255,255,255,0.28)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g; ctx.fillRect(x0, top, sw, h * 0.35);
    ctx.restore();
    ctx.strokeStyle = 'rgba(0,0,0,0.12)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x0 + sw, h); ctx.lineTo(x0 + sw, top + 20); ctx.stroke();
    if (p < 1) cur = { x: x0 + sw / 2, y: top + 10, len: sw * 0.98 };
  });
  sunlight(ctx, t, { strength: 0.8, leaves: 0.6, seed: 5 });
  if (cur) roller(ctx, cur.x, cur.y, cur.len, COLOR, t);
}, () => {
  cv.width = W(); cv.height = H(); ctx = cv.getContext('2d');
  oldW = plaster(W(), H(), { color: '#d8c49c', aged: true, seed: 4 });
  newW = freshPaint(W(), H(), COLOR, 31);
});
</script>
</body>
</html>
