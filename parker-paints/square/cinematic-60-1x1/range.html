<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="lib/parker.css">
<style>
  .studio { position: absolute; inset: 0; background: radial-gradient(ellipse 90% 50% at 50% 70%, #24304a 0%, #12141d 55%, #07080c 100%); }
  .floor { position: absolute; left: 0; right: 0; top: 64%; bottom: 0; background: linear-gradient(180deg, rgba(255,255,255,0.06), transparent 40%); }
  .spot { position: absolute; left: 50%; top: -10%; width: 120%; height: 90%; transform: translateX(-50%); background: radial-gradient(ellipse 35% 60% at 50% 0%, rgba(255, 236, 200, 0.22), transparent 70%); }
  .track { position: absolute; top: 64%; left: 0; height: 0; }
  .tin { position: absolute; bottom: 0; display: flex; flex-direction: column; align-items: center; }
  .tin img { height: 480px; width: auto; -webkit-box-reflect: below 6px linear-gradient(transparent 60%, rgba(255,255,255,0.22)); filter: drop-shadow(0 30px 30px rgba(0,0,0,0.5)); }
  .tin .nm { position: absolute; top: 100%; margin-top: 140px; font: 700 30px/1 Inter, sans-serif; letter-spacing: 0.18em; text-transform: uppercase; white-space: nowrap; color: rgba(255,255,255,0.8); }
  @media (min-aspect-ratio: 3/4) { .tin img { height: 330px; } .tin .nm { margin-top: 90px; font-size: 22px; } .track { top: 60%; } .floor { top: 60%; } }
  .count { display: flex; align-items: baseline; gap: 22px; }
  .count .n { font: 900 200px/0.9 Montserrat, sans-serif; color: var(--orange); }
  .count .u { font: 800 44px/1.05 Montserrat, sans-serif; text-transform: uppercase; }
  @media (min-aspect-ratio: 3/4) { .count .n { font-size: 130px; } .count .u { font-size: 32px; } }
</style>
</head>
<body>
<div class="stage">
  <div class="studio"></div><div class="floor"></div><div class="spot"></div>
  <div class="cam" data-from="1.0" data-to="1.05" data-whip="left"><div class="track" id="track"></div></div>
  <div class="words">
    <div class="count" data-rise="2.8"><span class="n" id="n">0</span><span class="u">products,<br>made in Zimbabwe</span></div>
  </div>
</div>
<script type="module">
import { shot, W, H, prog, ease, lerp } from './lib/kit.js';
const tins = [['wallshield', 'Wallshield'], ['silkshield', 'Silkshield'], ['shieldtex', 'Shieldtex'], ['premium-acrylic-pva', 'Acrylic PVA'], ['roof-paint', 'Roof & Stoep'],
  ['super-gloss-enamel', 'Super Gloss'], ['aqua-glow', 'Aqua Glo'], ['water-based-plaster-primer', 'Plaster Primer']];
const track = document.getElementById('track');
for (const [f, nm] of tins) track.insertAdjacentHTML('beforeend', `<div class="tin"><img src="img/products/${f}.png"><div class="nm">${nm}</div></div>`);
let gap = 0;
shot(6.5, (t) => {
  // the camera tracks along the shelf; the tin nearest the centre is lit and lifted
  const offset = lerp(W() * 0.25, -gap * (tins.length - 1) + W() * 0.75, ease.inOut(prog(t, 0, 5.5)));
  [...track.children].forEach((el, i) => {
    const x = offset + i * gap, d = Math.abs(x - W() / 2) / (W() * 0.6);
    const s = 1.08 - Math.min(0.32, d * 0.32);
    el.style.left = `${x}px`; el.style.transform = `translateX(-50%) scale(${s})`; el.style.transformOrigin = '50% 100%';
    el.style.opacity = Math.max(0.25, 1 - d * 0.8); el.style.filter = `brightness(${1.1 - Math.min(0.6, d * 0.6)})`;
  });
  const c = Math.round(29 * ease.out(prog(t, 2.8, 0.9)));
  document.getElementById('n').textContent = c;
}, () => { gap = W() > H() * 0.8 ? W() * 0.32 : W() * 0.52; });
</script>
</body>
</html>
