<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="lib/parker.css">
<style>
  .studio { position: absolute; inset: 0; background: radial-gradient(ellipse 75% 50% at 50% 55%, #2c3954 0%, #141824 58%, #07080c 100%); }
  .floor { position: absolute; left: 0; right: 0; top: 70%; bottom: 0; background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(0,0,0,0.4)); }
  .key { position: absolute; left: 50%; top: -15%; width: 140%; height: 100%; transform: translateX(-50%); background: radial-gradient(ellipse 30% 55% at 50% 0%, rgba(255,240,215,0.2), transparent 70%); }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .tin { position: absolute; left: 50%; transform: translateX(-50%); overflow: hidden; -webkit-mask-image: url(img/products/wallshield.png); -webkit-mask-size: 100% 100%; overflow: visible; }
  .tin img { display: block; height: 100%; width: auto; filter: contrast(1.04); }
  #tinlight { position: absolute; inset: 0; background: linear-gradient(100deg, rgba(255,255,255,0.0) 20%, rgba(255,255,255,0.22) 32%, transparent 45%); mix-blend-mode: soft-light; pointer-events: none; }
</style>
</head>
<body>
<div class="stage">
  <div class="studio"></div><div class="floor"></div><div class="key"></div>
  <div class="cam" data-from="1.0" data-to="1.1" data-dy="40" data-whip="none">
    <canvas id="back"></canvas>
    <div class="tin" id="tin"><img src="img/products/wallshield.png"><div id="tinlight"></div></div>
    <canvas id="front"></canvas>
  </div>
</div>
<script type="module">
import { shot, W, H, prog, ease, lerp } from './lib/kit.js';
import { pour } from './lib/fx.js';
// The real Parker Wallshield tin on a studio floor; thick paint pours down beside it and spreads into a glossy pool
// that runs underneath the tin. The pool's far half is drawn behind the tin, its near half in front.
const back = document.getElementById('back'), front = document.getElementById('front'); let bc, fc, g;
shot(4, (t) => {
  const opts = { cx: g.sx, top: -60, poolY: g.floor, color: '#1c55e0', width: g.w, start: 0.05, maxPool: g.maxPool, flat: 0.2 };
  bc.clearRect(0, 0, back.width, back.height); fc.clearRect(0, 0, front.width, front.height);
  bc.save(); bc.beginPath(); bc.rect(0, 0, back.width, g.floor); bc.clip(); pour(bc, t, opts); bc.restore();
  const cs = bc.createRadialGradient(g.tc, g.floor, 4, g.tc, g.floor, g.tw * 0.62);
  cs.addColorStop(0, 'rgba(0,0,0,0.55)'); cs.addColorStop(1, 'rgba(0,0,0,0)');
  bc.fillStyle = cs; bc.beginPath(); bc.ellipse(g.tc, g.floor, g.tw * 0.62, g.tw * 0.1, 0, 0, 7); bc.fill();
  fc.save(); fc.beginPath(); fc.rect(0, g.floor, front.width, front.height); fc.clip(); pour(fc, t, opts); fc.restore();
  // a slow light sweep across the tin
  document.getElementById('tinlight').style.transform = `translateX(${lerp(-60, 60, ease.inOut(prog(t, 0.6, 3)))}%)`;
}, () => {
  for (const c of [back, front]) { c.width = W(); c.height = H(); }
  bc = back.getContext('2d'); fc = front.getContext('2d');
  const v = H() > W() * 1.3, th = v ? H() * 0.38 : H() * 0.5, floor = v ? H() * 0.72 : H() * 0.86;
  const tin = document.getElementById('tin'); tin.style.height = `${th}px`; tin.style.top = `${floor - th * 0.97}px`;
  const tw = th * 606 / 753;
  const tc = W() * (v ? 0.4 : 0.42); tin.style.left = `${tc}px`;
  g = { floor: floor - th * 0.02, tc, tw, sx: tc + tw * 0.5 + (v ? 95 : 110), w: v ? 60 : 50, maxPool: v ? W() * 0.36 : W() * 0.26 };
});
</script>
</body>
</html>
