<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="lib/parker.css">
<style>
  .studio { position: absolute; inset: 0; background: radial-gradient(ellipse 80% 55% at 50% 62%, #2a3550 0%, #12141d 60%, #07080c 100%); }
  .tin { position: absolute; left: 50%; transform: translateX(-50%); }
  .label { position: absolute; left: 50%; transform: translateX(-50%); text-align: center; }
  .label .logo { font-size: 64px; }
  .label small { display: block; margin-top: 14px; font: 700 26px/1 Inter, sans-serif; letter-spacing: 0.28em; color: #193862; }
</style>
</head>
<body>
<div class="stage">
  <div class="studio"></div>
  <div class="cam" data-from="1.0" data-to="1.12" data-dy="30">
    <canvas class="full" id="cv"></canvas>
    <div class="label" id="label"><span class="logo">PARKER<sup>™</sup></span><small>WALLSHIELD</small></div>
  </div>
</div>
<script type="module">
import { shot, W, H, clamp } from './lib/kit.js';
import { pour, offscreen } from './lib/fx.js';
const cv = document.getElementById('cv'); let ctx, geo;
function tin(ctx, g, front) {
  const { cx, rimY, rx, ry, bodyH } = g;
  if (!front) {   // inside wall of the tin, behind the paint
    ctx.fillStyle = '#9aa1ab'; ctx.beginPath(); ctx.ellipse(cx, rimY, rx, ry, 0, Math.PI, 0); ctx.fill();
    return;
  }
  // body: white plastic pail, lit from the left
  const bg = ctx.createLinearGradient(cx - rx, 0, cx + rx, 0);
  bg.addColorStop(0, '#9da3ad'); bg.addColorStop(0.18, '#f4f6f8'); bg.addColorStop(0.45, '#ffffff'); bg.addColorStop(0.8, '#c9ced6'); bg.addColorStop(1, '#7d838d');
  ctx.fillStyle = bg; ctx.beginPath();
  ctx.moveTo(cx - rx, rimY); ctx.lineTo(cx - rx * 0.9, rimY + bodyH); ctx.ellipse(cx, rimY + bodyH, rx * 0.9, ry * 0.9, 0, Math.PI, 0, true); ctx.lineTo(cx + rx, rimY);
  ctx.ellipse(cx, rimY, rx, ry, 0, 0, Math.PI); ctx.fill();
  // rim
  ctx.strokeStyle = '#e9edf2'; ctx.lineWidth = 16; ctx.beginPath(); ctx.ellipse(cx, rimY, rx, ry, 0, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.ellipse(cx, rimY + 9, rx, ry, 0, 0, Math.PI); ctx.stroke();
  // blue label band
  ctx.fillStyle = 'rgba(28,70,184,0.92)'; const y0 = rimY + bodyH * 0.18, y1 = rimY + bodyH * 0.62;
  ctx.beginPath(); ctx.moveTo(cx - rx * 0.97, y0); ctx.lineTo(cx - rx * 0.93, y1); ctx.ellipse(cx, y1, rx * 0.93, ry * 0.93, 0, Math.PI, 0, true); ctx.lineTo(cx + rx * 0.97, y0); ctx.ellipse(cx, y0, rx * 0.97, ry * 0.97, 0, 0, Math.PI); ctx.fill();
  const sh = ctx.createLinearGradient(cx - rx, 0, cx + rx, 0); sh.addColorStop(0, 'rgba(0,0,0,0.35)'); sh.addColorStop(0.35, 'rgba(255,255,255,0.18)'); sh.addColorStop(1, 'rgba(0,0,0,0.4)');
  ctx.fillStyle = sh; ctx.fill();
}
shot(4, (t) => {
  ctx.clearRect(0, 0, cv.width, cv.height);
  const g = geo;
  // floor shadow
  const fs = ctx.createRadialGradient(g.cx, g.rimY + g.bodyH + 20, 10, g.cx, g.rimY + g.bodyH + 20, g.rx * 1.6);
  fs.addColorStop(0, 'rgba(0,0,0,0.6)'); fs.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = fs; ctx.fillRect(0, g.rimY, cv.width, cv.height);
  tin(ctx, g, false);
  // the paint inside: clip to the opening, pour lands in it
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, cv.width, g.rimY); ctx.ellipse(g.cx, g.rimY, g.rx - 8, g.ry - 4, 0, 0, Math.PI * 2); ctx.clip();
  ctx.restore(); ctx.save(); ctx.beginPath(); ctx.ellipse(g.cx, g.rimY, g.rx - 8, g.ry - 4, 0, 0, Math.PI * 2); ctx.clip();
  pour(ctx, t, { cx: g.cx + 10, top: -40, poolY: g.rimY + 6, color: '#1c55e0', width: g.rx * 0.2, start: 0.1, maxPool: g.rx });
  ctx.restore(); ctx.save(); ctx.beginPath(); ctx.rect(0, 0, cv.width, g.rimY - g.ry * 0.2); ctx.clip();
  pour(ctx, t, { cx: g.cx + 10, top: -40, poolY: g.rimY + 6, color: '#1c55e0', width: g.rx * 0.2, start: 0.1, maxPool: 0 });
  ctx.restore();
  tin(ctx, g, true);
}, () => {
  cv.width = W(); cv.height = H(); ctx = cv.getContext('2d');
  const v = H() > W() * 1.3;
  const rx = W() * (v ? 0.36 : 0.24), rimY = H() * (v ? 0.58 : 0.5), bodyH = rx * 1.15;
  geo = { cx: W() / 2, rimY, rx, ry: rx * 0.26, bodyH };
  const l = document.getElementById('label'); l.style.top = `${rimY + bodyH * 0.27}px`; l.style.fontSize = '1px';
  l.querySelector('.logo').style.fontSize = `${rx * 0.3}px`;
  l.querySelector('small').style.fontSize = `${rx * 0.075}px`; l.querySelector('small').style.color = '#fff';
});
</script>
</body>
</html>
