<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="lib/parker.css">
<style>
  .bg { position: absolute; inset: 0; background: radial-gradient(ellipse 90% 60% at 50% 40%, #1f4fae 0%, #193862 45%, #0b1730 100%); }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .block { position: absolute; left: 60px; right: 60px; top: 320px; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .block .logo { font-size: 160px; }
  .block .tagline { font-size: 42px; margin-top: 60px; }
  .block .tagline i { color: #ffd27a; }
  .cta { margin-top: 70px; font: 900 64px/1 Montserrat, sans-serif; text-transform: uppercase; color: var(--orange); }
  .num { margin-top: 26px; font: 800 52px/1.2 Montserrat, sans-serif; }
  .num i { font-style: normal; color: rgba(255,255,255,0.45); padding: 0 14px; }
  .addr { margin-top: 12px; font: 500 30px/1.3 Inter, sans-serif; color: rgba(255,255,255,0.8); }
  .pills { margin-top: 34px; display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
  .pill { padding: 16px 26px; border-radius: 999px; background: #fff; color: var(--navy); font: 700 30px/1 Inter, sans-serif; }
  @media (min-aspect-ratio: 3/4) { .block { top: 60px; } .block .logo { font-size: 104px; } .block .tagline { font-size: 30px; margin-top: 18px; } .cta { margin-top: 36px; font-size: 48px; }
    .num { margin-top: 16px; font-size: 42px; } .addr { font-size: 24px; } .pills { margin-top: 22px; } .pill { font-size: 24px; padding: 12px 20px; } }
</style>
</head>
<body>
<div class="stage">
  <div class="bg"></div>
  <canvas id="cv"></canvas>
  <div class="cam" data-from="1.0" data-to="1.03" data-whip="none">
    <div class="block">
      <span class="logo" data-pop="0.15">PARKER<sup>™</sup></span>
      <div class="tagline" data-rise="1.35">Parker the <i>perfect</i> finish</div>
      <div class="cta" data-pop="2.9">Call us today</div>
      <div class="num" data-rise="3.1">+263 77 472 6179<i>·</i>(0242) 663270</div>
      <div class="addr" data-rise="3.3">6 Portland Road, Workington, Harare</div>
      <div class="pills" data-rise="3.6"><span class="pill">Free colour samples</span><span class="pill">Find a dealer</span></div>
    </div>
  </div>
</div>
<script type="module">
import { shot, W, H, prog, ease } from './lib/kit.js';
import { splat } from './lib/fx.js';
const cv = document.getElementById('cv'); let ctx;
shot(5.3, (t) => {
  ctx.clearRect(0, 0, cv.width, cv.height);
  // an orange splat bursts behind the logo, then settles
  const v = H() > W() * 1.3;
  splat(ctx, W() / 2, v ? 410 : 110, (v ? 230 : 105) * ease.out5(prog(t, 0.05, 0.45)), 'rgba(254,152,50,0.9)', 7, prog(t, 0.05, 0.45));
}, () => { cv.width = W(); cv.height = H(); ctx = cv.getContext('2d'); });
</script>
</body>
</html>
