<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="lib/parker.css">
<link rel="stylesheet" href="lib/badge.css">
<style>
  .bg { position: absolute; inset: 0; background: radial-gradient(circle at 50% 45%, #ffb35c, #fe9832 40%, #c2410c 100%); }
  #rays { position: absolute; left: 50%; top: 45%; width: 3000px; height: 3000px; margin: -1500px 0 0 -1500px; background: repeating-conic-gradient(rgba(255,255,255,0.16) 0 6deg, transparent 6deg 16deg); }
  .center { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); }
  .words { text-align: center; }
  .tins { position: absolute; left: 0; right: 0; bottom: 17%; display: flex; justify-content: center; gap: 26px; align-items: flex-end; }
  .tins img { height: 330px; filter: drop-shadow(0 24px 24px rgba(0,0,0,0.45)); }
  @media (min-aspect-ratio: 3/4) { .tins { display: none; } }
  .big { font-size: 84px; color: #fff; }
  @media (min-aspect-ratio: 3/4) { .seal { font-size: 400px; } .center { top: 56%; } .big { font-size: 60px; } }
</style>
</head>
<body>
<div class="stage">
  <div class="bg"></div><div id="rays"></div>
  <div class="cam" data-from="1.0" data-to="1.05" data-whip="none">
    <div class="center"><div class="seal" id="seal"><div class="ring"></div><div class="ten">10</div><div class="yr">YEAR</div><div class="rib">GUARANTEE</div><div class="glint" id="glint"></div></div></div>
  </div>
  <div class="tins" id="tins"><img src="img/products/silkshield.png" data-rise="0.3"><img src="img/products/wallshield.png" data-rise="0.4"><img src="img/products/premium-acrylic-pva.png" data-rise="0.5"></div>
  <div class="words"><div class="big" data-rise="0.2">Premium paint</div></div>
</div>
<script type="module">
import { shot, prog, ease, lerp, shake } from './lib/kit.js';
const STAMP = 2.55;   // lands on "ten-year"
const seal = document.getElementById('seal');
shot(3.8, (t) => {
  const p = prog(t, STAMP - 0.35, 0.35), e = ease.in(p), [sx, sy] = shake(t, STAMP, 22);
  seal.style.transform = `translate(${sx}px, ${sy}px) scale(${lerp(2.8, 1, e)}) rotate(${lerp(-20, -6, e)}deg)`;
  seal.style.opacity = Math.min(1, p * 3);
  document.getElementById('tins').style.transform = `translateY(${ease.in(prog(t, STAMP - 0.3, 0.3)) * 0 + (t > STAMP ? shake(t, STAMP, 10)[1] : 0)}px)`; seal.style.filter = p < 1 ? `blur(${(1 - e) * 14}px)` : 'none';
  document.getElementById('glint').style.transform = `translateX(${lerp(-120, 120, ease.inOut(prog(t, STAMP + 0.3, 0.8)))}%)`;
  document.getElementById('rays').style.transform = `rotate(${t * 14}deg)`;
});
</script>
</body>
</html>
