<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="lib/brand.css">
<style>
  .phone .screen { background: linear-gradient(160deg, #2E5795, #0B1F3A 75%); color: #fff; }
  .clock { text-align: center; margin-top: 60px; font-weight: 600; font-size: 130px; line-height: 1; letter-spacing: -0.02em; }
  .date { text-align: center; margin-top: 10px; font-weight: 500; font-size: 26px; color: #c9d4e6; }
  .note { margin: 0 20px 16px; padding: 20px 22px; border-radius: 28px; background: rgba(255,255,255,.94); color: #1b2433; display: flex; gap: 18px; }
  .note .app { width: 66px; height: 66px; border-radius: 16px; background: #2fbf5b; display: grid; place-items: center; flex: none; }
  .note .app.form { background: var(--blue); }
  .note .app svg { width: 38px; height: 38px; }
  .note b { display: block; font-size: 23px; }
  .note span { display: block; margin-top: 4px; font-size: 22px; line-height: 1.3; color: #3b475c; }
  .note i { font-style: normal; float: right; font-size: 19px; color: #7a8598; font-weight: 500; }
  .stack { position: absolute; left: 0; right: 0; top: 380px; }
  .done { position: absolute; left: 50%; top: 660px; margin-left: -90px; width: 180px; height: 180px; }
  .done svg { width: 100px; height: 100px; }
  .headline .line { display: block; }
</style>
</head>
<body>
<div class="stage"></div>
<div class="phone"><div class="notch"></div><div class="screen">
  <div class="clock">10:24</div><div class="date">Tuesday · Harare</div>
  <div class="stack">
    <div class="note" data-rise="0.5"><div class="app form"><svg viewBox="0 0 24 24" fill="none"><rect x="4" y="3" width="16" height="18" rx="3" stroke="#fff" stroke-width="2.2"/><path d="M8 8h8M8 12h8M8 16h5" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg></div>
      <div><b>New enquiry <i>now</i></b><span>“Hi! Can I get a quote for a website for my shop?”</span></div></div>
    <div class="note" data-rise="1.4"><div class="app"><svg viewBox="0 0 24 24" fill="none"><path d="M4 18.5l1.3-3.8A8 8 0 1110 19.5z" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/></svg></div>
      <div><b>New message <i>now</i></b><span>“Found you online — are you free this week?”</span></div></div>
  </div>
  <div class="tick done" id="tick" data-pop="2.8"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#0B1F3A" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
</div></div>
<div class="headline" id="headline" data-fit="70">
  <span class="line" data-rise="0.3">Fixed-price quotes ·</span>
  <span class="line hl" data-rise="2.0">Same-day reply</span>
</div>
<script type="module">
import { shot } from './lib/shot.js';
shot(6);
</script>
</body>
</html>
