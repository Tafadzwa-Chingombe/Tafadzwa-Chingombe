<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="lib/brand.css">
<link rel="stylesheet" href="lib/pages.css">
<style>
  /* the firm's real content manager: dashboard → New article → type → Publish */
  .browser { position: absolute; left: 50px; right: 50px; top: 380px; height: 679px; border-radius: 26px; overflow: hidden;
    background: #0a0f18; box-shadow: 0 40px 120px rgba(0,0,0,.55), 0 0 0 3px #2b3a52 inset; }
  .bar { height: 66px; display: flex; align-items: center; gap: 12px; padding: 0 24px; background: #1b2433; }
  .bar i { width: 16px; height: 16px; border-radius: 50%; background: #ff6159; }
  .bar i:nth-child(2) { background: #ffbd2e; } .bar i:nth-child(3) { background: #28c941; }
  .bar .url { flex: 1; margin-left: 18px; height: 40px; border-radius: 999px; background: #0f1724; color: #b9c6da;
    display: flex; align-items: center; padding: 0 20px; font-weight: 500; font-size: 20px; }
  .view { position: absolute; left: 0; right: 0; top: 66px; bottom: 0; overflow: hidden; background: #f3f1ec; }
  /* everything inside is laid out in the screenshots' own 1440×900 pixels, then scaled to the window */
  .canvas { position: absolute; left: 0; top: 0; width: 1440px; height: 900px; transform-origin: 0 0; transform: scale(0.6806); }
  .canvas img { position: absolute; left: 0; top: 0; width: 1440px; height: 900px; }
  .typed-title { position: absolute; left: 155px; top: 210px; width: 782px; height: 52px; background: #fff; border-radius: 6px;
    padding: 0 16px; display: flex; align-items: center; font-family: Georgia, 'DejaVu Serif', serif; font-size: 26px; color: #14213a; }
  .typed-body { position: absolute; left: 156px; top: 440px; width: 780px; height: 70px; background: #fff;
    padding: 12px 18px; font-family: Inter, 'DejaVu Sans', sans-serif; font-size: 19px; line-height: 1.5; color: #2c3445; }
  .cursor { position: absolute; left: 0; top: 0; width: 44px; height: 44px; }
  .ring { position: absolute; width: 70px; height: 70px; margin: -35px 0 0 -35px; border-radius: 50%; border: 5px solid #ABCF47; opacity: 0; }
  .toastwrap { position: absolute; left: 0; right: 0; top: 110px; display: flex; justify-content: center; }
  .toast { display: flex; align-items: center; gap: 14px;
    padding: 18px 30px; border-radius: 999px; background: #1f7a4a; color: #fff; font-family: Inter, sans-serif; font-weight: 700; font-size: 28px;
    box-shadow: 0 16px 40px rgba(0,0,0,.25); white-space: nowrap; }
  .toast svg { width: 30px; height: 30px; }
</style>
</head>
<body>
<div class="stage"></div>
<div class="browser" id="browser" data-rise="0.1">
  <div class="bar"><i></i><i></i><i></i><div class="url">Content Manager · MC Attorneys</div></div>
  <div class="view"><div class="canvas">
    <img id="dash" src="assets/site/cms-dashboard.jpg" alt="MC Attorneys content manager: articles">
    <img id="edit" src="assets/site/cms-editor.jpg" alt="MC Attorneys content manager: new article">
    <div class="typed-title" id="title"></div>
    <div class="typed-body" id="body"></div>
    <div class="ring" id="ring"></div>
    <svg class="cursor" id="cursor" viewBox="0 0 24 24"><path d="M4 2l15 11-6.5 1.2L16 21l-3 1.4-3.6-6.9L4 19z" fill="#0B1F3A" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>
    <div class="toastwrap"><div class="toast" id="toast" data-pop="5.85"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>Article published</div></div>
  </div></div>
</div>
<div class="headline" id="headline" data-rise="0.4" data-fit="70"><span>Easy to <span class="hl">update</span></span></div>
<script type="module">
import { shot } from './lib/shot.js';
import { $, prog, ease, lerp, typed, clamp } from './lib/kit.js';
const canvas = $('.canvas'), edit = $('#edit'), title = $('#title'), body = $('#body'), cursor = $('#cursor'), ring = $('#ring');
// where the cursor goes (screenshot pixels) and when
const path = [
  [0.0, 720, 640], [0.3, 720, 640], [1.1, 1248, 116],   // to "+ New article"
  [1.45, 1248, 116], [1.75, 560, 236],                    // to the title field
  [3.2, 560, 236], [3.45, 560, 470],                      // to the content
  [5.2, 560, 470], [5.65, 1224, 364],                     // to "Publish"
];
const clicks = [1.15, 5.7];
function at(t) {
  let [t0, x0, y0] = path[0];
  for (const [t1, x1, y1] of path.slice(1)) {
    if (t <= t1) { const p = ease.inOut(prog(t, t0, t1 - t0)); return [lerp(x0, x1, p), lerp(y0, y1, p)]; }
    [t0, x0, y0] = [t1, x1, y1];
  }
  return [x0, y0];
}
shot(7.5, (t) => {
  // camera: zoom in on the editor while typing (readable on a phone), back out for the Publish click
  const z = ease.inOut(prog(t, 1.5, 0.45)) * (1 - ease.inOut(prog(t, 5.0, 0.4)));
  canvas.style.transform = `translate(${lerp(0, -70, z)}px, ${lerp(0, -54, z)}px) scale(${lerp(0.6806, 1.0, z)})`;
  edit.style.opacity = prog(t, 1.3, 0.25);
  title.style.opacity = t >= 1.55 ? 1 : 0;
  body.style.opacity = t >= 3.4 ? 1 : 0;
  typed(title, 'Buying property in 2026: your checklist', t, 1.8, 24);
  typed(body, 'Here is what to prepare before you sign an agreement of sale.', t, 3.5, 36);
  const [x, y] = at(t);
  cursor.style.transform = `translate(${x - 6}px, ${y - 4}px)`;
  let r = 0, op = 0;
  for (const c of clicks) { const p = prog(t, c, 0.45); if (t >= c && p < 1) { r = 0.4 + p; op = 1 - p; } }
  ring.style.left = `${x}px`; ring.style.top = `${y}px`;
  ring.style.opacity = op; ring.style.transform = `scale(${r || 1})`;
});
</script>
</body>
</html>
