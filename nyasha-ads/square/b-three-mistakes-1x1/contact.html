<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="lib/brand.css">
<style>
  .phone .screen { background: #fff; }
  .site { padding: 0 30px; }
  .site .top { display: flex; align-items: center; justify-content: space-between; padding: 14px 0 18px; font-weight: 700; font-size: 28px; color: #26364f; }
  .site .top i { width: 40px; height: 4px; background: #26364f; box-shadow: 0 10px 0 #26364f, 0 -10px 0 #26364f; }
  .site .hero { height: 250px; border-radius: 22px; background: linear-gradient(120deg, #7c95b8, #c9d6e8); display: flex; align-items: flex-end; padding: 22px;
    font-weight: 700; font-size: 32px; color: #fff; }
  .site h5 { margin: 26px 0 12px; font-size: 26px; color: #26364f; }
  .site .line { height: 16px; border-radius: 8px; background: #e3e7ee; margin-bottom: 14px; }
  .lens { position: absolute; width: 120px; height: 120px; margin: -60px 0 0 -60px; }
  .lens svg { width: 120px; height: 120px; }
  .missing { position: absolute; left: 30px; right: 30px; top: 470px; display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .missing .pill { padding: 16px 28px; border-radius: 999px; background: var(--red); color: #fff; font-weight: 700; font-size: 28px; }
  .fixbar { position: absolute; left: 0; right: 0; bottom: 0; padding: 22px 22px 34px; background: #fff; box-shadow: 0 -10px 30px rgba(0,0,0,.12);
    display: flex; gap: 16px; }
  .fixbar div { flex: 1; height: 86px; border-radius: 22px; display: flex; align-items: center; justify-content: center; gap: 12px;
    font-weight: 700; font-size: 28px; color: #fff; }
  .fixbar svg { width: 34px; height: 34px; }
  .fixbar .call { background: var(--blue); }
  .fixbar .chat { background: #2fbf5b; }
  .fixed { position: absolute; right: -30px; top: -40px; width: 110px; height: 110px; }
  .fixed svg { width: 64px; height: 64px; }
  .phone { overflow: visible; }
</style>
</head>
<body>
<div class="stage"></div>
<div class="phone"><div class="notch"></div><div class="screen">
  <div class="status"><span>9:41</span><span>●●● 5G</span></div>
  <div class="site">
    <div class="top">Moyo Interiors <i></i></div>
    <div class="hero">Furniture, made in Harare</div>
    <h5>About us</h5>
    <div class="line"></div><div class="line" style="width: 90%"></div><div class="line" style="width: 95%"></div><div class="line" style="width: 70%"></div>
    <h5>Our work</h5>
    <div class="line"></div><div class="line" style="width: 85%"></div><div class="line" style="width: 92%"></div>
  </div>
  <div class="lens" id="lens" data-rise="0.3" data-out="2.4"><svg viewBox="0 0 24 24" fill="none"><circle cx="10.5" cy="10.5" r="6.5" fill="rgba(46,87,149,.12)" stroke="#2E5795" stroke-width="2.2"/><path d="M15.5 15.5L21 21" stroke="#2E5795" stroke-width="2.6" stroke-linecap="round"/></svg></div>
  <div class="missing" data-pop="2.5" data-out="3.8">
    <div class="cross"><svg viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/></svg></div>
    <span class="pill">Where do I contact you?</span>
  </div>
  <div class="fixbar" id="fixbar">
    <div class="call"><svg viewBox="0 0 24 24" fill="none"><path d="M6.6 10.8a15 15 0 006.6 6.6l2.2-2.2a1 1 0 011-.25 11.4 11.4 0 003.6.57 1 1 0 011 1V20a1 1 0 01-1 1A17 17 0 013 4a1 1 0 011-1h3.5a1 1 0 011 1c0 1.25.2 2.45.57 3.57a1 1 0 01-.25 1z" fill="#fff"/></svg>Call us</div>
    <div class="chat"><svg viewBox="0 0 24 24" fill="none"><path d="M4 18.5l1.3-3.8A8 8 0 1110 19.5z" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/></svg>WhatsApp</div>
  </div>
</div>
<div class="tick fixed" id="fixed" data-pop="4.0"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#0B1F3A" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
</div>
<div class="headline" id="headline" data-rise="0.2" data-fit="70"><span><span class="hl">2</span> · No clear contact button</span></div>
<script type="module">
import { shot } from './lib/shot.js';
import { $, prog, ease } from './lib/kit.js';
const lens = $('#lens'), bar = $('#fixbar');
shot(7, (t) => {
  // the lens wanders the page looking for a way to get in touch
  const u = Math.min(t, 2.4);
  lens.style.left = `${240 + 150 * Math.sin(u * 2.3)}px`;
  lens.style.top = `${330 + 260 * Math.sin(u * 1.1 + 0.4)}px`;
  // the fix slides up: a call and chat bar on every page
  const p = ease.out(prog(t, 3.8, 0.5));
  bar.style.transform = `translateY(${(1 - p) * 160}px)`;
});
</script>
</body>
</html>
