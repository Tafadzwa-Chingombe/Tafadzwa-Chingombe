<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="lib/brand.css">
<style>
  .bar { margin: 14px 26px 18px; height: 70px; border-radius: 999px; background: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.12);
    display: flex; align-items: center; gap: 14px; padding: 0 24px; font-size: 26px; font-weight: 500; color: #1b2433; }
  .bar svg { width: 30px; height: 30px; flex: none; }
  .result { margin: 0 26px 16px; padding: 22px 24px; border-radius: 22px; background: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
  .result .name { font-weight: 700; font-size: 27px; color: #1a4fb4; }
  .result .meta { margin-top: 6px; font-size: 21px; color: #5a6578; }
  .result .stars { color: #f2a900; letter-spacing: 2px; }
  .result.you { background: transparent; box-shadow: none; border: 3px dashed #c3cad6; position: relative; }
  .result.you .name { color: #9aa4b4; }
  .result.you .cross { position: absolute; right: 18px; top: 50%; margin-top: -40px; width: 80px; height: 80px; }
  .result.you .cross svg { width: 44px; height: 44px; }
  .call { position: absolute; left: 20px; right: 20px; bottom: 26px; padding: 22px 26px; border-radius: 26px; background: #1b2433; color: #fff;
    display: flex; align-items: center; gap: 18px; font-size: 24px; font-weight: 600; }
  .call .dot { width: 64px; height: 64px; border-radius: 50%; background: #2fbf5b; display: grid; place-items: center; flex: none; }
  .call .dot svg { width: 34px; height: 34px; }
  .call small { display: block; font-weight: 500; color: #a9b3c4; font-size: 20px; }
</style>
</head>
<body>
<div class="stage"></div>
<div class="phone"><div class="notch"></div><div class="screen">
  <div class="status"><span>9:41</span><span>●●● 5G</span></div>
  <div class="bar"><svg viewBox="0 0 24 24" fill="none"><circle cx="10.5" cy="10.5" r="6.5" stroke="#5a6578" stroke-width="2.6"/><path d="M15.5 15.5L21 21" stroke="#5a6578" stroke-width="2.6" stroke-linecap="round"/></svg><span id="query"></span></div>
  <div class="result" data-rise="1.5"><div class="name">Tendai's Plumbing · Harare</div><div class="meta"><span class="stars">★★★★★</span> 4.8 · Open now</div></div>
  <div class="result" data-rise="1.95"><div class="name">CityFix Plumbers</div><div class="meta"><span class="stars">★★★★☆</span> 4.6 · Avondale</div></div>
  <div class="result" data-rise="2.4"><div class="name">Rapid Pipes Zimbabwe</div><div class="meta"><span class="stars">★★★★☆</span> 4.5 · Borrowdale</div></div>
  <div class="result you" data-rise="2.9"><div class="name">Your business</div><div class="meta">Not found</div>
    <div class="cross" data-pop="3.2"><svg viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/></svg></div></div>
  <div class="call" data-rise="3.7">
    <div class="dot"><svg viewBox="0 0 24 24" fill="none"><path d="M6.6 10.8a15 15 0 006.6 6.6l2.2-2.2a1 1 0 011-.25 11.4 11.4 0 003.6.57 1 1 0 011 1V20a1 1 0 01-1 1A17 17 0 013 4a1 1 0 011-1h3.5a1 1 0 011 1c0 1.25.2 2.45.57 3.57a1 1 0 01-.25 1z" fill="#fff"/></svg></div>
    <div>Calling Tendai's Plumbing…<small>Your customer, on the phone to someone else</small></div>
  </div>
</div></div>
<div class="headline soft" id="headline" data-rise="0.3" data-fit="70">They called <span class="hl">someone else.</span></div>
<script type="module">
import { shot } from './lib/shot.js';
import { $, typed } from './lib/kit.js';
const q = $('#query');
shot(6, (t) => typed(q, 'plumber near me harare', t, 0.15, 20));
</script>
</body>
</html>
