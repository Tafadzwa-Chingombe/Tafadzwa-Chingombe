<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="lib/brand.css">
<style>
  /* over the whole film: the wordmark */
  .scrim { position: absolute; left: 0; right: 0; top: 0; height: 430px; background: linear-gradient(rgba(11, 31, 58, 0.6), rgba(11, 31, 58, 0)); }
  .wordmark { position: absolute; left: 60px; top: 262px; font-weight: 800; font-size: 46px; letter-spacing: 0.04em; line-height: 1; }
  .wordmark .i { color: var(--green); }
  .wordmark small { display: block; margin-top: 8px; font-weight: 600; font-size: 15px; letter-spacing: 0.32em; color: var(--muted); }
</style>
</head>
<body>
<div class="scrim"></div>
<div class="wordmark" id="wordmark"><span class="i">i</span>CONTACT<small>AFRICA SOLUTIONS</small></div>
<script type="module">
import { loaded } from './lib/kit.js';
window.film = { ready: loaded(), frame() {} };
</script>
</body>
</html>
