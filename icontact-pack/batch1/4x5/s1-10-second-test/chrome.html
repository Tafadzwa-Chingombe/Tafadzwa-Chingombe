<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="lib/ic.css">
<style>
  body { background: transparent; }
  /* over the whole film: optional soft film grain and vignette (cinematic pieces only) */
  #grain { position: absolute; inset: 0; width: 100%; height: 100%; mix-blend-mode: overlay; opacity: 0.16; }
  .vignette { position: absolute; inset: 0; background: radial-gradient(ellipse 80% 72% at 50% 46%, transparent 60%, rgba(0, 0, 0, 0.45) 100%); }
</style>
</head>
<body>
<canvas id="grain"></canvas>
<div class="vignette" id="vig"></div>
<script type="module">
import { loaded } from './lib/kit.js';
import { grainTiles } from './lib/fx.js';
import { look } from './lib/cuts.js';
const cv = document.getElementById('grain'), ctx = cv.getContext('2d');
let tiles = null;
if (!look.grain) cv.style.display = 'none';
if (!look.vignette) document.getElementById('vig').style.display = 'none';
window.film = {
  ready: loaded(() => { if (look.grain) { cv.width = innerWidth; cv.height = innerHeight; tiles = grainTiles(4, 512); } }),
  frame(t) {
    if (!tiles) return;
    const f = Math.floor(t * 24), tile = tiles[f % 4];
    ctx.save(); ctx.translate(-((f * 137) % 512), -((f * 251) % 512));
    for (let y = 0; y < cv.height + 512; y += 512) for (let x = 0; x < cv.width + 512; x += 512) ctx.drawImage(tile, x, y);
    ctx.restore();
  },
};
</script>
</body>
</html>
