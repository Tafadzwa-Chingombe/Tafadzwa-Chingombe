<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="lib/ic.css">
<style>
  .chat { position: absolute; inset: 56px 0 0; background: #ece5dd; font-family: var(--f-ui); zoom: 1.12; }
  .chat .hd { display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: #0f5c4e; color: #fff; font: 600 16px var(--f-ui); }
  .chat .av { width: 34px; height: 34px; border-radius: 50%; background: #9fb4ad; }
  .chat .hd small { display: block; font: 400 12px var(--f-ui); opacity: .8; }
  .msgs { padding: 12px; display: grid; gap: 10px; }
  .day { justify-self: center; font: 600 11px var(--f-ui); color: #5d6b7c; background: #e1f2fb; padding: 4px 10px; border-radius: 8px; }
  .out { justify-self: end; max-width: 80%; background: #d9fdd3; border-radius: 12px 12px 2px 12px; padding: 9px 11px; font: 400 15px/1.35 var(--f-ui); color: #13202f; box-shadow: 0 1px 1px rgba(0,0,0,.12); }
  .out small { display: block; text-align: right; margin-top: 3px; font: 400 11px var(--f-ui); color: #6b7a87; }
  .out small b { color: #8a96a3; font-weight: 400; }
  .phone { top: 545px; transform: scale(0.9); transform-origin: 50% 0; }
  .top .title { font-size: 70px; }
  .top .title span { display: block; color: var(--muted); }
</style>
</head>
<body>
<div class="stage">
  <div class="bg-navy"></div>
  <div class="cam" data-from="1.0" data-to="1.03">
    <div class="top"><div class="title" data-rise="0.3">Paid a deposit.<span data-rise="1.2">Then silence.</span></div></div>
    <div class="phone"><div class="screen"><div class="notch"></div><div class="status"><span>9:41</span><span>●●● 5G</span></div>
      <div class="chat"><div class="hd"><span class="av"></span><span>Web developer<small>last seen 3 weeks ago</small></span></div>
        <div class="msgs">
          <div class="day">MONDAY</div>
          <div class="out" data-pop="0.5">Hi, deposit sent. When can we see the first design?<small>09:12 <b>✓</b></small></div>
          <div class="day" data-rise="1.6">THURSDAY</div>
          <div class="out" data-pop="1.9">Any update on the website?<small>14:40 <b>✓</b></small></div>
          <div class="day" data-rise="3.0">LAST WEEK</div>
          <div class="out" data-pop="3.3">Hello? Please call me back.<small>17:05 <b>✓</b></small></div>
        </div></div></div>
      <div class="label-example" style="left:28px;top:-20px">Example</div></div>
  </div>
</div>
<script type="module">
import { shot } from './lib/kit.js';
shot(6);
</script>
</body>
</html>
