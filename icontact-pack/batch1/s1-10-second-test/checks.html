<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="lib/ic.css">
<style>
  .phone { top: 565px; transform: scale(0.88); transform-origin: 50% 0; }
  #timer { right: 70px; top: 330px; transform: scale(0.72); transform-origin: 100% 0; }
  .checks { top: 345px; right: 260px; }
  .urlbar { margin: 4px 16px 0; padding: 10px 14px; border-radius: 12px; background: #eef2f7; font: 500 15px var(--f-ui); color: #5d6b7c; }
</style>
<style id="tcss"></style>
</head>
<body>
<div class="stage">
  <div class="bg-navy"></div>
  <div class="cam" data-from="1.0" data-to="1.03">
    <div class="checks">
      <div class="check" id="c1"><span class="box"></span>What you do</div>
      <div class="check" id="c2"><span class="box"></span>Where you work</div>
      <div class="check" id="c3"><span class="box"></span>How to reach you</div>
    </div>
    <div id="ph"></div>
    <div id="tw"></div>
  </div>
</div>
<script type="module">
import { shot } from './lib/kit.js';
import { phone, goodSite, timerHTML, timerCSS, setTimer, scrollTo, highlight, TICK } from './lib/ui.js';
import { starts } from './lib/cuts.js';
document.getElementById('tcss').textContent = timerCSS;
document.querySelectorAll('.box').forEach((b) => { b.innerHTML = TICK; });
document.getElementById('ph').innerHTML = phone('<div class="urlbar">example-plumbing.co.zw</div>' + goodSite());
document.getElementById('tw').innerHTML = timerHTML();
const T0 = 2.9;   // film time the clock started (see timer.html)
// when each answer is said (page time = voice time + 0.2); synced to the voice-over
const SAY = [2.5, 3.45, 4.45];
shot(10, (t) => {
  setTimer(starts[1] + t - T0);
  ['c1', 'c2', 'c3'].forEach((id, i) => document.getElementById(id).classList.toggle('on', t >= SAY[i]));
  const sc = document.querySelector('.scroller');
  scrollTo(sc, t, [[0, 0], [SAY[1] - 0.6, 0], [SAY[1] - 0.1, 250], [SAY[2] - 0.6, 250], [SAY[2] - 0.1, 40]]);
  highlight(document.querySelector('[data-hl="what"] .mk-h1'), t, SAY[0]);
  highlight(document.querySelector('[data-hl="where"]'), t, SAY[1]);
  highlight(document.querySelector('[data-hl="contact"]'), t, SAY[2]);
});
</script>
</body>
</html>
