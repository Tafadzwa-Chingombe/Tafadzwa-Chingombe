<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="lib/ic.css">
<style>
  /* the supplied logo file, unaltered, on a panel the same off-white as its own background */
  .plate { padding: 30px 44px; border-radius: 26px; background: #f6f6f6; box-shadow: 0 20px 50px rgba(0,0,0,0.35); }
  .plate img { display: block; width: 560px; height: auto; }
  .glow { position: absolute; left: 50%; top: 46%; width: 1300px; height: 1300px; margin: -650px 0 0 -650px; border-radius: 50%;
    background: radial-gradient(circle, rgba(171,207,71,0.10), transparent 60%); }
</style>
</head>
<body>
<div class="stage">
  <div class="bg-navy"></div><div class="glow" id="glow"></div>
  <div class="cam" data-from="1.0" data-to="1.02">
    <div class="ec">
      <div class="plate" data-rise="0.1"><img src="img/icontact-logo.png" alt="iContact"></div>
      <div class="tag" data-rise="0.35">Websites that bring in enquiries. <span>Not just compliments.</span></div>
      <div class="wa" data-pop="0.8">
        <svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M16 3a13 13 0 0 0-11.2 19.6L3 29l6.6-1.7A13 13 0 1 0 16 3z" fill="#fff"/><path d="M11.6 9.6c-.3-.7-.6-.7-.9-.7h-.8c-.3 0-.7.1-1 .5-.4.4-1.3 1.3-1.3 3.1s1.3 3.6 1.5 3.9c.2.2 2.6 4.1 6.4 5.6 3.1 1.2 3.8 1 4.5.9.7-.1 2.2-.9 2.5-1.8.3-.9.3-1.6.2-1.8-.1-.2-.3-.3-.7-.5l-2.5-1.2c-.3-.1-.6-.2-.8.2-.2.4-.9 1.2-1.1 1.4-.2.2-.4.3-.8.1-.4-.2-1.6-.6-3-1.9-1.1-1-1.9-2.2-2.1-2.6-.2-.4 0-.6.2-.8l.6-.7c.2-.2.3-.4.4-.7.1-.3 0-.5 0-.7l-1.3-2.9z" fill="#25a244"/></svg>
        <span>WhatsApp <b>{{KEYWORD}}</b><br>to +263 71 857 4277</span>
      </div>
      <div class="foot" data-rise="1.2">iContact Africa Solutions | Harare, Zimbabwe</div>
    </div>
  </div>
</div>
<script type="module">
import { shot, pulse } from './lib/kit.js';
shot(5, (t) => { document.getElementById('glow').style.transform = `scale(${pulse(t, 4, 0.06)})`; });
</script>
</body>
</html>
