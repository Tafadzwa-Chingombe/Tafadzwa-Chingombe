<!doctype html>
<html>
<head><meta charset="utf-8"><link rel="stylesheet" href="lib/ic.css">
<style>
  .phone { left: 26px; margin-left: 0; top: 600px; transform: rotate(-4deg) scale(0.46); transform-origin: 0 0; box-shadow: 0 50px 100px rgba(0,0,0,0.7); }
  .urlbar { margin: 4px 16px 0; padding: 10px 14px; border-radius: 12px; background: #eef2f7; font: 500 15px var(--f-ui); color: #5d6b7c; }
</style></head>
<body>
<div class="stage">
  <div class="cam" data-from="1.04" data-to="1.0"><canvas class="full" id="cv"></canvas></div>
  <div id="ph" data-rise="0.3"></div>
</div>
<script type="module">
import { shot, W, H, ease, prog, lerp } from './lib/kit.js';
import { makeStreet, drawStreet, SCENE } from './lib/street.js';
import { phone, goodSite } from './lib/ui.js';
document.getElementById('ph').innerHTML = phone('<div class="urlbar">example-business.co.zw</div>' + goodSite());
const cv = document.getElementById('cv'); let ctx, S;
shot(5, (t) => {
  const light = ease.inOut(prog(t, 0.6, 1.6));
  const walk = prog(t, 1.0, 2.6), x = lerp(1180, SCENE.DOOR.x + SCENE.DOOR.w / 2, ease.out(walk));
  const door = ease.inOut(prog(t, 2.6, 0.7)) * (1 - ease.inOut(prog(t, 4.2, 0.6)));
  drawStreet(ctx, t, S, { light, sign: light, door, client: t < 3.6 ? x : null, clientScale: 0.82 });
}, () => { cv.width = W(); cv.height = H(); ctx = cv.getContext('2d'); S = makeStreet(W(), H()); });
</script>
</body>
</html>
