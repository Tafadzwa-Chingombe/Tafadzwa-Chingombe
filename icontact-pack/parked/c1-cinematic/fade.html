<!doctype html>
<html>
<head><meta charset="utf-8"><link rel="stylesheet" href="lib/ic.css"></head>
<body>
<div class="stage"><div class="cam" data-from="1.12" data-to="1.04" data-dy="30"><canvas class="full" id="cv"></canvas></div></div>
<script type="module">
import { shot, W, H, ease, prog } from './lib/kit.js';
import { makeStreet, drawStreet } from './lib/street.js';
const cv = document.getElementById('cv'); let ctx, S;
shot(5, (t) => { const k = 1 - ease.inOut(prog(t, 0.5, 3.2)); drawStreet(ctx, t, S, { light: k, sign: 1 - ease.inOut(prog(t, 0.3, 2.4)) }); },
  () => { cv.width = W(); cv.height = H(); ctx = cv.getContext('2d'); S = makeStreet(W(), H()); });
</script>
</body>
</html>
