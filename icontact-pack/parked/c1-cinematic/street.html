<!doctype html>
<html>
<head><meta charset="utf-8"><link rel="stylesheet" href="lib/ic.css"></head>
<body>
<div class="stage"><div class="cam" data-from="1.0" data-to="1.1" data-dy="-40"><canvas class="full" id="cv"></canvas></div></div>
<script type="module">
import { shot, W, H, lerp, prog } from './lib/kit.js';
import { makeStreet, drawStreet } from './lib/street.js';
const cv = document.getElementById('cv'); let ctx, S;
shot(5, (t) => { drawStreet(ctx, t, S, { light: 1, sign: 1, passer: lerp(-160, 1200, prog(t, 0, 5)) }); },
  () => { cv.width = W(); cv.height = H(); ctx = cv.getContext('2d'); S = makeStreet(W(), H()); });
</script>
</body>
</html>
